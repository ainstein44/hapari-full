  <style>
    :root{--navy:#12355b;--teal:#087f87;--aqua:#e9f7f7;--line:#d9e5e9;--ink:#172b3a;--muted:#647782;--green:#15803d;--orange:#d97706;--red:#c2413a}*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:var(--ink);font:15px/1.5 "Noto Sans KR","Malgun Gothic",Arial,sans-serif}.app{width:min(100%,460px);min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 28px #20384a18}.header{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:800;color:var(--navy);letter-spacing:-.4px}.brand small{display:block;font-size:11px;color:var(--teal);letter-spacing:0}.back{border:0;background:none;color:var(--navy);font-size:25px;cursor:pointer}.page{padding:22px 20px 90px;min-height:calc(100vh - 64px)}h1,h2,h3,p{margin-top:0}.hero{padding:26px 22px;background:linear-gradient(135deg,#effafb,#fff 70%);border-bottom:1px solid var(--line)}.hero h1{margin-bottom:8px;color:var(--navy);font-size:26px;letter-spacing:-1.2px}.hero p{color:var(--muted);margin:0}.notice{margin-top:18px;padding:13px 14px;border-left:4px solid var(--teal);border-radius:6px;background:#f1faf9;color:#335864;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.menu{min-height:126px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer;box-shadow:0 3px 10px #16334a0a}.menu:last-child{grid-column:span 2;min-height:104px}.menu .icon{display:grid;place-items:center;width:38px;height:38px;margin-bottom:12px;border-radius:10px;background:var(--aqua);color:var(--teal);font-size:21px}.menu b{display:block;color:var(--navy);letter-spacing:-.5px}.menu small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);height:66px;display:flex;background:#fff;border-top:1px solid var(--line)}.bottom button{flex:1;border:0;background:#fff;color:var(--muted);font:12px inherit;cursor:pointer}.bottom button.active{color:var(--teal);font-weight:800}.bottom span{display:block;font-size:18px}.section-title{margin-bottom:8px;color:var(--navy);font-size:21px;letter-spacing:-.8px}.sub{margin-bottom:18px;color:var(--muted);font-size:13px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 8px #16334a08}.map-shell{position:relative;height:360px;overflow:hidden;border:1px solid #cbd9de;border-radius:14px;background:#dcebed}.map-frame{display:block;width:100%;height:100%;border:0}.map-overlay{position:absolute;inset:0;pointer-events:none}.flag{position:absolute;pointer-events:auto;border:0;border-radius:9px 9px 9px 0;padding:7px 8px;background:var(--teal);color:#fff;font:700 12px inherit;box-shadow:0 2px 8px #063e4e70;cursor:pointer}.flag:after{content:"";position:absolute;left:8px;bottom:-12px;border:6px solid transparent;border-top-color:var(--teal)}.flag small{display:block;font-weight:500;font-size:10px;opacity:.95}.flag[data-beach="songjeong"]{left:82%;top:47%}.flag[data-beach="haeundae"]{left:54%;top:72%}.flag[data-beach="gwangalli"]{left:20%;top:79%}.my-dot{display:none;position:absolute;left:59%;top:56%;width:16px;height:16px;border:3px solid #fff;border-radius:50%;background:#2563eb;box-shadow:0 0 0 4px #2563eb4d}.my-dot.show{display:block}.map-actions{display:flex;gap:8px;margin-top:10px}.outline{padding:10px 12px;border:1px solid #b9cbd1;border-radius:8px;background:#fff;color:var(--navy);font:700 13px inherit;cursor:pointer}.outline.active{border-color:var(--teal);background:var(--aqua);color:var(--teal)}.location-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.location-options .outline{min-height:46px;text-align:left}.location-options .outline:first-child{grid-column:span 2}.location-status{margin:10px 2px 0;color:var(--muted);font-size:12px}.info-card{display:none;margin-top:14px}.info-card.show{display:block}.info-head{display:flex;align-items:flex-start;gap:10px}.info-head h3{margin:0;color:var(--navy);font-size:17px}.badge{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:99px;background:#edf1f2;color:#536872;font-size:11px;font-weight:800}.data-none{margin:11px 0 0;padding:11px;border-radius:8px;background:#f7f9fa;color:#4d6570;font-size:13px}.meta{margin-top:10px;color:var(--muted);font-size:11px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:14px 2px 0;color:var(--muted);font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.green{background:var(--green)}.orange{background:var(--orange)}.red{background:var(--red)}.photo{display:flex;min-height:190px;align-items:center;justify-content:center;overflow:hidden;border:2px dashed #b8cbd0;border-radius:14px;background:#f8fbfc;text-align:center;color:var(--muted);cursor:pointer}.photo input{display:none}.photo img{width:100%;height:220px;object-fit:cover}.photo b{display:block;color:var(--navy);font-size:16px}.field-label{display:block;margin:17px 0 7px;color:var(--navy);font-weight:700;font-size:13px}textarea{width:100%;height:82px;padding:10px;border:1px solid #cddbe0;border-radius:10px;font:inherit;resize:vertical}.primary{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:800 15px inherit;cursor:pointer}.primary:disabled{background:#aab8bc;cursor:not-allowed}.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid #a9c4c7;border-radius:10px;background:#fff;color:var(--navy);font:700 14px inherit;cursor:pointer}.result{margin-top:16px;padding:14px;border-radius:12px;background:#f2f8f8;color:#36545d;font-size:13px}.guide li{padding:11px 0;border-bottom:1px solid var(--line)}.warning{padding:14px;border-radius:12px;background:#fff5ed;color:#85341e}.empty{text-align:center;padding:44px 15px;color:var(--muted)}@media(min-width:480px){body{padding:20px}.app{min-height:820px;border-radius:18px;overflow:hidden}.bottom{bottom:20px;border-radius:0 0 18px 18px}}

<body><main class="app" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
<script>
const app=document.querySelector('#app');
// 제공받은 Teachable Machine 모델은 앱과 같은 폴더의 jellyfish-model에서 실행됩니다.
const TM_MODEL_URL='./model.json', TM_METADATA_URL='./metadata.json';
let view='home',photo='',located=false,reportLocation='',submitted=false,reportSaved=false,analyzed=false,analyzing=false,analysisResult=null,selectedBeach=null,tmModel=null,tmLabels=[],modelError='',uiLang='ko';
const translations={en:{'부산 해수욕장':'Busan Beaches','해파리 안전정보':'Jellyfish Safety','부산 해수욕장 해파리 안전정보':'Busan Jellyfish Safety','홈':'Home','위험 해역':'Risk map','위험생물 제보':'Report','내 제보':'My reports','위험 해역 지도':'Risk area map','해운대 · 광안리 · 송정':'Haeundae · Gwangalli · Songjeong','사진과 위치로 제보':'Report with photo & location','쏘임 대처법':'First aid','응급 안전수칙 확인':'Safety guidance','사진 판별':'Photo identification','현재 데모 기능':'On-device AI','내 제보 확인':'Check your reports','제보 상태를 확인합니다':'View report status','위험 해역 확인부터 안전수칙, 위험생물 제보까지 한 곳에서 안내합니다.':'Check risk areas, first aid, and reports in one place.','실시간 위험도 데이터는 공공 해양 관측 API 또는 검토된 제보 데이터가 연결된 뒤 제공합니다.':'Live risk data will appear after verified observation data is connected.','사진과 발견 위치를 모두 선택해야 제보할 수 있습니다.':'Select both a photo and where it was found to report.','사진 촬영 또는 업로드':'Take or upload a photo','해파리가 잘 보이도록 촬영해 주세요.':'Make sure the jellyfish is clearly visible.','발견 위치':'Found at','현재 내 위치 사용':'Use my current location','현재 위치 확인됨':'Current location confirmed','송정 해수욕장':'Songjeong Beach','광안리 해수욕장':'Gwangalli Beach','해운대 해수욕장':'Haeundae Beach','정확한 위치를 모르거나 권한을 허용하지 않으려면 해수욕장을 직접 선택해 주세요.':'Choose a beach if you do not know the exact location or do not allow location access.','추가 설명':'Additional notes','(선택)':'(optional)','제보하기':'Submit report','선택한 위치: ':'Selected location: ','사진과 위치 정보를 검토한 뒤 안전정보에 반영합니다.':'We will review the photo and location before updating safety information.','새 제보 작성':'New report','현재 데이터 없음':'No current data','사진은 외부 서버로 보내지 않고 이 기기에서 학습 모델로 분석합니다.':'Photos are analyzed on this device and are not sent to a server.','사진 분석 요청':'Analyze photo','사진 분석 중…':'Analyzing photo…','판별 불가':'Unable to identify','해파리 가능성 있음':'Possible jellyfish','해운대 해역':'Haeundae area','광안리 해역':'Gwangalli area','송정 해역':'Songjeong area'},zh:{'부산 해수욕장':'釜山海水浴场','해파리 안전정보':'水母安全信息','부산 해수욕장 해파리 안전정보':'釜山海水浴场水母安全信息','홈':'首页','위험 해역':'风险海域','위험생물 제보':'危险生物举报','내 제보':'我的举报','위험 해역 지도':'风险海域地图','해운대 · 광안리 · 송정':'海云台 · 广安里 · 松亭','사진과 위치로 제보':'用照片和位置举报','쏘임 대처법':'蜇伤急救','응급 안전수칙 확인':'查看安全指南','사진 판별':'照片识别','현재 데모 기능':'设备端 AI','내 제보 확인':'查看我的举报','제보 상태를 확인합니다':'查看举报状态','위험 해역 확인부터 안전수칙, 위험생물 제보까지 한 곳에서 안내합니다.':'在这里查看风险海域、急救方法和危险生物举报。','실시간 위험도 데이터는 공공 해양 관측 API 또는 검토된 제보 데이터가 연결된 뒤 제공합니다.':'连接经验证的观测数据后将显示实时风险信息。','사진과 발견 위치를 모두 선택해야 제보할 수 있습니다.':'请选择照片和发现位置后再举报。','사진 촬영 또는 업로드':'拍摄或上传照片','해파리가 잘 보이도록 촬영해 주세요.':'请让水母在照片中清晰可见。','발견 위치':'发现位置','현재 내 위치 사용':'使用当前位置','현재 위치 확인됨':'当前位置已确认','송정 해수욕장':'松亭海水浴场','광안리 해수욕장':'广安里海水浴场','해운대 해수욕장':'海云台海水浴场','정확한 위치를 모르거나 권한을 허용하지 않으려면 해수욕장을 직접 선택해 주세요.':'若不清楚准确位置或不允许定位，请直接选择海水浴场。','추가 설명':'补充说明','(선택)':'（可选）','제보하기':'提交举报','선택한 위치: ':'已选位置：','사진과 위치 정보를 검토한 뒤 안전정보에 반영합니다.':'审核照片和位置信息后将更新安全信息。','새 제보 작성':'创建新举报','현재 데이터 없음':'暂无当前数据','사진은 외부 서버로 보내지 않고 이 기기에서 학습 모델로 분석합니다.':'照片仅在此设备上使用训练模型分析，不会发送到服务器。','사진 분석 요청':'分析照片','사진 분석 중…':'正在分析照片…','판별 불가':'无法识别','해파리 가능성 있음':'可能是水母','해운대 해역':'海云台海域','광안리 해역':'广安里海域','송정 해역':'松亭海域'}};
function setLanguage(lang){uiLang=lang;document.documentElement.lang=lang==='zh'?'zh-CN':lang;render()}
function translateApp(){if(uiLang==='ko')return;const dict=translations[uiLang];const translate=value=>dict[value]||value;document.title=translate('부산 해수욕장 해파리 안전정보');const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{const raw=node.nodeValue;const trimmed=raw.trim();if(!trimmed)return;let converted=translate(trimmed);if(trimmed.startsWith('선택한 위치: '))converted=translate('선택한 위치: ')+translate(trimmed.slice(7));if(converted!==trimmed)node.nodeValue=raw.replace(trimmed,converted)});app.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{['placeholder','aria-label','title'].forEach(attr=>{const value=el.getAttribute(attr);if(value)el.setAttribute(attr,translate(value))})})}
const beaches={haeundae:{name:'해운대',place:'해운대 해수욕장'},gwangalli:{name:'광안리',place:'광안리 해수욕장'},songjeong:{name:'송정',place:'송정 해수욕장'}};
function header(title){return `<header class="header"><button class="back" aria-label="처음 화면으로" onclick="go('home')">‹</button><div class="brand"><small>부산 해수욕장</small>${title}</div><select class="lang-select" aria-label="언어 선택" onchange="setLanguage(this.value)"><option value="ko" ${uiLang==='ko'?'selected':''}>한국어</option><option value="en" ${uiLang==='en'?'selected':''}>English</option><option value="zh" ${uiLang==='zh'?'selected':''}>中文</option></select></header>`}
function nav(active){return `<nav class="bottom"><button class="${active==='home'?'active':''}" onclick="go('home')"><span>⌂</span>홈</button><button class="${active==='map'?'active':''}" onclick="go('map')"><span>⌖</span>위험 해역</button><button class="${active==='report'?'active':''}" onclick="go('report')"><span>＋</span>위험생물 제보</button><button class="${active==='mine'?'active':''}" onclick="go('mine')"><span>☷</span>내 제보</button></nav>`}
function go(next){view=next;render()}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function imageBox(){return `<label class="photo">${photo?`<img src="${photo}" alt="선택한 제보 사진">`:`<div><div style="font-size:31px">▧</div><b>사진 촬영 또는 업로드</b><small>해파리가 잘 보이도록 촬영해 주세요.</small></div>`}<input type="file" accept="image/*" onchange="pickPhoto(event)"></label>`}
function pickPhoto(e){const f=e.target.files[0];if(f){photo=URL.createObjectURL(f);analyzed=false;analysisResult=null;render()}}
function mapLocationText(){return located?'현재 위치 확인됨':'현재 내 위치 사용'}
function reportLocationText(){const names={current:'현재 내 위치',songjeong:'송정 해수욕장',gwangalli:'광안리 해수욕장',haeundae:'해운대 해수욕장'};return names[reportLocation]||'발견 위치를 선택해 주세요'}
function requestLocation(){if(!navigator.geolocation){alert('이 브라우저에서는 위치 기능을 지원하지 않습니다. HTTPS 환경에서 이용해 주세요.');return}navigator.geolocation.getCurrentPosition(()=>{located=true;reportLocation='current';render()},()=>{alert('위치 권한을 확인해 주세요. file:// 환경에서는 제한될 수 있으며 HTTPS 배포에서 안정적으로 동작합니다.')},{enableHighAccuracy:true,timeout:10000})}
function setReportBeach(id){reportLocation=id;render()}
function selectBeach(id){selectedBeach=id;render()}
function mapSection(){const selected=selectedBeach?beaches[selectedBeach]:null;return `<section class="page"><h1 class="section-title">부산 해역 안전정보</h1><p class="sub">해수욕장 깃발을 선택하면 해당 해역의 데이터 상태를 확인할 수 있습니다.</p><div class="map-shell"><iframe class="map-frame" title="부산 동부 해안 OpenStreetMap" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=129.104%2C35.145%2C129.214%2C35.222&amp;layer=mapnik"></iframe><div class="map-overlay"><button class="flag" data-beach="songjeong" onclick="selectBeach('songjeong')">송정<small>해수욕장</small></button><button class="flag" data-beach="haeundae" onclick="selectBeach('haeundae')">해운대<small>해수욕장</small></button><button class="flag" data-beach="gwangalli" onclick="selectBeach('gwangalli')">광안리<small>해수욕장</small></button><i class="my-dot ${located?'show':''}" title="현재 위치"></i></div></div><div class="map-actions"><button class="outline" onclick="requestLocation()">⌖ ${mapLocationText()}</button></div><p class="location-status">${located?'위치가 지도 위에 파란 점으로 표시됩니다.':'위치 사용은 권한 허용 후 이용할 수 있습니다. HTTPS 배포를 권장합니다.'}</p>${selected?`<article class="card info-card show"><div class="info-head"><span style="font-size:24px">⌖</span><div><h3>${selected.name} 해역</h3><span class="badge">현재 데이터 없음</span></div></div><div class="data-none">실시간 위험도·관측 종·이동 방향 데이터가 아직 연결되지 않았습니다. 임의의 관측 결과나 위험도는 표시하지 않습니다.</div><p class="meta">데이터 출처: 미연결 · 마지막 갱신: - · 위험도 기준: 실제 관측 API 또는 관리자 검토 데이터 연동 후 제공</p></article>`:''}<div class="legend"><span><i class="dot green"></i>낮음</span><span><i class="dot orange"></i>보통</span><span><i class="dot red"></i>높음</span><span>※ 실제 데이터 연동 후 표시</span></div></section>`}
let publicJellyfishStatus={generatedAt:null,source:'국립수산과학원 해파리 신고',beaches:{}};
async function loadPublicJellyfishStatus(){
  try{
    const response=await fetch('./data/jellyfish-status.json',{cache:'no-store'});
    if(!response.ok)throw new Error('status unavailable');
    publicJellyfishStatus=await response.json();
  }catch(error){
    publicJellyfishStatus={generatedAt:null,source:'국립수산과학원 해파리 신고',beaches:{}};
  }
  render();
}
function selectBeach(id){selectedBeach=id;loadPublicJellyfishStatus();render()}
function publicStatusCard(id,selected){
  const item=publicJellyfishStatus.beaches&&publicJellyfishStatus.beaches[id];
  if(!item||!item.available)return `<article class="card info-card show"><div class="info-head"><span style="font-size:24px">⌖</span><div><h3>${selected.name} 해역</h3><span class="badge">현재 데이터 없음</span></div></div><div class="data-none">공식 데이터에서 ${selected.name} 해수욕장과 일치하는 최신 관측·신고 정보를 찾지 못했습니다. 위험도는 임의로 표시하지 않습니다.</div><p class="meta">데이터 출처: ${publicJellyfishStatus.source||'미연결'} · 마지막 갱신: ${publicJellyfishStatus.generatedAt||'-'} · 위험도 기준: 공식 위험도 자료가 제공될 때만 표시</p></article>`;
  const species=item.species&&item.species.length?item.species.join(' · '):'종 정보 없음';
  return `<article class="card info-card show"><div class="info-head"><span style="font-size:24px">⌖</span><div><h3>${selected.name} 해역</h3><span class="badge">공식 관측·신고 정보</span></div></div><div class="result"><b>위험도: 판정 데이터 없음</b><p>신고·관측 건수 ${item.count}건 · 관측 종: ${escapeHtml(species)}</p><p>최근 관측 시각: ${escapeHtml(item.observedAt||'확인되지 않음')}</p></div><p class="meta">데이터 출처: ${escapeHtml(publicJellyfishStatus.source||'국립수산과학원 해파리 신고')} · 마지막 갱신: ${escapeHtml(publicJellyfishStatus.generatedAt||'-')} · 위험도는 공식 기준이 제공될 때만 표시</p></article>`;
}
function mapSection(){const selected=selectedBeach?beaches[selectedBeach]:null;return `<section class="page"><h1 class="section-title">부산 해역 안전정보</h1><p class="sub">해수욕장 깃발을 선택하면 해당 해역의 공식 관측·신고 정보를 확인할 수 있습니다.</p><div class="map-shell"><iframe class="map-frame" title="부산 동부 해안 OpenStreetMap" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=129.104%2C35.145%2C129.214%2C35.222&amp;layer=mapnik"></iframe><div class="map-overlay"><button class="flag" data-beach="songjeong" onclick="selectBeach('songjeong')">송정<small>해수욕장</small></button><button class="flag" data-beach="haeundae" onclick="selectBeach('haeundae')">해운대<small>해수욕장</small></button><button class="flag" data-beach="gwangalli" onclick="selectBeach('gwangalli')">광안리<small>해수욕장</small></button><i class="my-dot ${located?'show':''}" title="현재 위치"></i></div></div><div class="map-actions"><button class="outline" onclick="requestLocation()">⌖ ${mapLocationText()}</button></div><p class="location-status">${located?'위치가 지도 위에 파란 점으로 표시됩니다.':'위치 사용은 권한 허용 후 이용할 수 있습니다. HTTPS 배포를 권장합니다.'}</p>${selected?publicStatusCard(selectedBeach,selected):''}<div class="legend"><span><i class="dot green"></i>낮음</span><span><i class="dot orange"></i>보통</span><span><i class="dot red"></i>높음</span><span>※ 공식 위험도 데이터가 제공될 때만 표시</span></div></section>`}
loadPublicJellyfishStatus();
const REPORTS_STORAGE_KEY='busan-jellyfish-reports-v1';
function getReports(){try{return JSON.parse(localStorage.getItem(REPORTS_STORAGE_KEY)||'[]')}catch{return[]}}
function saveReport(){if(reportSaved)return;const reports=getReports();reports.unshift({id:Date.now(),location:reportLocationText(),createdAt:new Date().toLocaleString('ko-KR'),status:analysisResult?.status||'error',species:analysisResult?.species||null,confidence:analysisResult?.confidence??null});try{localStorage.setItem(REPORTS_STORAGE_KEY,JSON.stringify(reports.slice(0,30)));reportSaved=true}catch{}}
function reportStatusText(report){return report.status==='likely'?(report.species||'해파리 가능성 있음'):report.status==='uncertain'?'판별 불가':'분석 오류'}
function analysisCard(){if(!analysisResult)return '';const title=analysisResult.status==='likely'?'해파리 가능성 있음':analysisResult.status==='uncertain'?'판별 불가':'분석 오류';return `<div class="result" style="text-align:left"><b>${title}</b><p>${analysisResult.message}</p>${analysisResult.species?`<p><b>추정 분류:</b> ${analysisResult.species}</p>`:''}${typeof analysisResult.confidence==='number'?`<p><b>신뢰도:</b> ${Math.round(analysisResult.confidence*100)}%</p>`:''}${analysisResult.predictions?`<p class="meta">${analysisResult.predictions.map(p=>`${p.label} ${Math.round(p.confidence*100)}%`).join(' · ')}</p>`:''}<p>${analysisResult.nextAction||''}</p></div>`}
function reportSection(){if(submitted)return `<section class="page"><div class="empty"><div style="font-size:42px">✓</div><h2>제보를 접수했습니다</h2><p>선택한 위치: ${reportLocationText()}</p>${analyzing?`<div class="result"><b>사진 판별 중…</b><p>이 기기에서 학습 모델로 바로 분석하고 있습니다.</p></div>`:analysisCard()}<p class="meta">AI 판별 결과는 참고용이며, 검토 전에는 공식 해역 안전정보에 자동 반영되지 않습니다.</p><button class="primary" onclick="resetReport()">새 제보 작성</button></div></section>`;return `<section class="page"><h1 class="section-title">위험생물 제보</h1><p class="sub">사진과 발견 위치를 모두 선택해야 제보할 수 있습니다.</p>${imageBox()}<label class="field-label">발견 위치</label><div class="location-options"><button class="outline ${reportLocation==='current'?'active':''}" onclick="requestLocation()">⌖ ${reportLocation==='current'?'현재 위치 확인됨':'현재 내 위치 사용'}</button><button class="outline ${reportLocation==='songjeong'?'active':''}" onclick="setReportBeach('songjeong')">송정 해수욕장</button><button class="outline ${reportLocation==='gwangalli'?'active':''}" onclick="setReportBeach('gwangalli')">광안리 해수욕장</button><button class="outline ${reportLocation==='haeundae'?'active':''}" onclick="setReportBeach('haeundae')">해운대 해수욕장</button></div><p class="location-status">${reportLocation?`선택한 위치: ${reportLocationText()}`:'정확한 위치를 모르거나 권한을 허용하지 않으려면 해수욕장을 직접 선택해 주세요.'}</p><label class="field-label">추가 설명 <span style="font-weight:400;color:#647782">(선택)</span></label><textarea placeholder="발견한 장소, 크기, 특이사항을 적어 주세요."></textarea><button class="primary" ${(!photo||!reportLocation)?'disabled':''} onclick="submitReport()">제보하고 바로 판별하기</button><p class="meta">사진은 외부 서버로 전송하지 않고 이 기기에서 판별합니다.</p></section>`}
async function submitReport(){if(!photo||!reportLocation)return;submitted=true;reportSaved=false;analyzing=true;analysisResult=null;render();try{await loadJellyfishModel();const image=new Image();image.src=photo;await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject});const tensor=tf.tidy(()=>tf.image.resizeBilinear(tf.browser.fromPixels(image),[224,224]).toFloat().div(127.5).sub(1).expandDims());const output=tmModel.predict(tensor);const scores=await output.data();tensor.dispose();output.dispose();const predictions=tmLabels.map((label,index)=>({label,confidence:scores[index]||0})).sort((a,b)=>b.confidence-a.confidence);const top=predictions[0];const unknown=/판별.*없|알 수 없|unknown/i.test(top.label);analysisResult={status:unknown||top.confidence<.65?'uncertain':'likely',species:unknown?null:top.label,confidence:top.confidence,predictions,message:unknown||top.confidence<.65?'사진만으로 확실하게 판별하기 어렵습니다.':'제보 사진을 학습 모델이 바로 판별한 결과입니다.',nextAction:unknown||top.confidence<.65?'대상을 더 가깝고 밝게 다시 촬영하거나 관리자 검토를 요청해 주세요.':'해파리를 만지지 말고 안전거리를 유지하세요. 증상이 있으면 즉시 안전수칙을 확인하세요.'}}catch(error){analysisResult={status:'error',message:'사진 판별을 실행하지 못했습니다.',nextAction:error.message||'인터넷 연결과 모델 파일을 확인해 주세요.'}}finally{analyzing=false;saveReport();render()}}function resetReport(){photo='';located=false;reportLocation='';submitted=false;reportSaved=false;analyzed=false;analysisResult=null;render()}
async function loadJellyfishModel(){if(tmModel)return;try{if(!window.tf)throw new Error('AI 실행 파일을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');const meta=await fetch(TM_METADATA_URL).then(r=>{if(!r.ok)throw new Error('모델 정보 파일을 찾지 못했습니다.');return r.json()});tmLabels=meta.labels||[];tmModel=await tf.loadLayersModel(TM_MODEL_URL)}catch(error){modelError=error.message;throw error}}
async function analyzePhoto(){if(!photo||analyzing)return;try{analyzing=true;render();await loadJellyfishModel();const image=new Image();image.src=photo;await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject});const tensor=tf.tidy(()=>tf.image.resizeBilinear(tf.browser.fromPixels(image),[224,224]).toFloat().div(127.5).sub(1).expandDims());const output=tmModel.predict(tensor);const scores=await output.data();tensor.dispose();output.dispose();const predictions=tmLabels.map((label,index)=>({label,confidence:scores[index]||0})).sort((a,b)=>b.confidence-a.confidence);const top=predictions[0];const unknown=/판별.*없|알 수 없|unknown/i.test(top.label);analysisResult={status:unknown||top.confidence<.65?'uncertain':'likely',species:unknown?null:top.label,confidence:top.confidence,predictions,message:unknown||top.confidence<.65?'사진만으로 확실하게 판별하기 어렵습니다.':'학습 모델의 1차 판별 결과입니다.',nextAction:unknown||top.confidence<.65?'대상을 더 가깝고 밝게 다시 촬영하거나 위험생물 제보로 검토를 요청해 주세요.':'해파리를 만지지 말고 안전거리를 유지하세요. 결과가 안전정보에 자동 반영되지는 않습니다.'};analyzed=true}catch(error){analysisResult={status:'error',message:'사진 판별을 실행하지 못했습니다.',nextAction:error.message||'HTTPS로 배포한 뒤 다시 시도해 주세요.'};analyzed=true}finally{analyzing=false;render()}}
function identifySection(){return `<section class="page"><h1 class="section-title">사진 판별</h1><p class="sub">사진은 외부 서버로 보내지 않고 이 기기에서 학습 모델로 분석합니다.</p>${imageBox()}${photo&&!analyzed?`<button class="primary" ${analyzing?'disabled':''} onclick="analyzePhoto()">${analyzing?'사진 분석 중…':'사진 분석 요청'}</button>`:''}${analyzed?analysisCard():''}<p class="meta">학습 분류: 노무라입깃해파리 · 보름달물해파리 · 푸른우산관해파리 · 판별할 수 없음</p><p class="meta">AI 결과는 참고용이며, 위험해 보이면 만지지 말고 제보해 주세요.</p></section>`}
function guideSection(){return `<section class="page guide"><h1 class="section-title">해파리 쏘임 대처법</h1><ol><li>즉시 물 밖으로 나와 안전한 곳으로 이동합니다.</li><li>바닷물로 상처 부위를 부드럽게 씻습니다.</li><li>촉수는 카드 등으로 조심스럽게 제거합니다.</li><li>통증이 심하거나 호흡 곤란·전신 증상이 있으면 119에 신고합니다.</li></ol><div class="warning"><b>하지 마세요</b><br>맨손으로 촉수를 떼거나 상처를 문지르지 마세요.</div></section>`}
function mineSection(){const reports=getReports();return `<section class="page"><h1 class="section-title">내 제보</h1><div class="card"><b style="color:#12355b">제보 현황</b><p class="sub" style="margin:8px 0 0">이 기기에서 제출한 제보 ${reports.length}건</p></div>${reports.length?`<div style="margin-top:16px;display:grid;gap:10px">${reports.map(report=>`<article class="card"><b>${escapeHtml(reportStatusText(report))}</b><p style="margin:7px 0 0">${escapeHtml(report.location)}</p><p class="meta">${escapeHtml(report.createdAt)}${typeof report.confidence==='number'?` · 신뢰도 ${Math.round(report.confidence*100)}%`:''}</p></article>`).join('')}</div><p class="meta">제보 기록은 현재 이 기기의 브라우저에만 저장됩니다.</p>`:`<div class="empty"><div style="font-size:38px">▧</div><p>이 기기에서 제출한 제보가 아직 없습니다.</p><p>위험생물을 발견했다면 사진과 위치를 함께 제보해 주세요.</p><button class="primary" onclick="go('report')">위험생물 제보하기</button></div>`}</section>`}
function render(){let html='';if(view==='home')html=`<section class="hero"><div class="language-home"><label for="home-language">언어</label><select id="home-language" class="lang-select" onchange="setLanguage(this.value)"><option value="ko" ${uiLang==='ko'?'selected':''}>한국어</option><option value="en" ${uiLang==='en'?'selected':''}>English</option><option value="zh" ${uiLang==='zh'?'selected':''}>中文</option></select></div><h1>부산 해수욕장<br>해파리 안전정보</h1><p>위험 해역 확인부터 안전수칙, 위험생물 제보까지 한 곳에서 안내합니다.</p><div class="notice">실시간 위험도 데이터는 공공 해양 관측 API 또는 검토된 제보 데이터가 연결된 뒤 제공합니다.</div><div class="grid"><button class="menu" onclick="go('map')"><span class="icon">⌖</span><b>위험 해역 지도</b><small>해운대 · 광안리 · 송정</small></button><button class="menu" onclick="go('report')"><span class="icon">＋</span><b>위험생물 제보</b><small>사진과 위치로 제보</small></button><button class="menu" onclick="go('guide')"><span class="icon">!</span><b>쏘임 대처법</b><small>응급 안전수칙 확인</small></button><button class="menu" onclick="go('identify')"><span class="icon">⌕</span><b>사진 판별</b><small>현재 데모 기능</small></button><button class="menu" onclick="go('mine')"><span class="icon">☷</span><b>내 제보 확인</b><small>제보 상태를 확인합니다</small></button></div></section>`+nav('home');else if(view==='map')html=header('위험 해역 지도')+mapSection()+nav('map');else if(view==='report')html=header('위험생물 제보')+reportSection()+nav('report');else if(view==='guide')html=header('안전수칙')+guideSection()+nav();else if(view==='identify')html=header('사진 판별')+identifySection()+nav();else html=header('내 제보')+mineSection()+nav('mine');app.innerHTML=html;translateApp()}render();
</script></body></html>
